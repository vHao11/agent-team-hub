[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-team-hub"
version = "0.5.0"
description = "Cross-team collaboration ledger and shared capability library for agent harnesses"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.txt"]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "SQLAlchemy>=2.0,<2.1",
  "pydantic>=2.9,<3",
  "python-multipart>=0.0.20,<1",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
mcp = ["mcp>=1.12,<2"]
dev = ["pytest>=8,<10", "python-dotenv>=1,<2", "jsonschema>=4.23,<5"]

[project.scripts]
teamhub-server = "teamhub.__main__:main"

[tool.setuptools.packages.find]
where = ["server"]

[tool.setuptools.package-data]
teamhub = ["static/**/*", "sample_content/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["server"]
addopts = "-q"
